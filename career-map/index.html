<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <title>なづなのキャリアMAP</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="キャリアMAP">
  <meta name="theme-color" content="#111111">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23111'/%3E%3Cpath d='M12 40 L26 26 L36 34 L52 18' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23111'/%3E%3Cpath d='M12 40 L26 26 L36 34 L52 18' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #FFFFFF;
      --ink: #111111;
      --sub: #767676;
      --faint: #A9A9A9;
      --line: #E3E3E3;
      --accent: #B23B3B;
      --serif: 'Hiragino Mincho ProN','Yu Mincho','YuMincho','Times New Roman',serif;
      --sans: -apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Meiryo',sans-serif;
      --mono: 'SFMono-Regular',Menlo,Consolas,'Courier New',monospace;
      --max-w: 620px;
    }
    html, body { background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-text-size-adjust: 100%; }
    #root { max-width: var(--max-w); margin: 0 auto; min-height: 100vh; border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
    .screen { padding: 22px 20px calc(90px + env(safe-area-inset-bottom)); }
    .kicker { font-size: 10px; letter-spacing: .22em; color: var(--sub); text-transform: uppercase; }
    .display { font-family: var(--serif); font-weight: 400; letter-spacing: .01em; line-height: 1.3; }
    .d-xl { font-size: 30px; }
    .d-lg { font-size: 22px; }
    .d-md { font-size: 18px; }
    .num { font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
    .sub { font-size: 12.5px; color: var(--sub); line-height: 1.85; }
    .xs { font-size: 11px; color: var(--sub); line-height: 1.7; }
    .sec { border-top: 1px solid var(--ink); padding-top: 10px; margin-top: 26px; }
    .sec-line { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 20px; }
    .row { display: flex; align-items: center; gap: 10px; }
    .between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .wrap { flex-wrap: wrap; }
    .btn { display: inline-block; padding: 10px 16px; border: 1px solid var(--ink); background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 13px; font-weight: 700; cursor: pointer; }
    .btn:active { opacity: .7; }
    .btn:disabled { opacity: .35; cursor: default; }
    .btn-fill { background: var(--ink); color: #fff; }
    .btn-block { display: block; width: 100%; text-align: center; }
    .btn-sm { padding: 7px 11px; font-size: 12px; }
    .btn-bare { border: none; background: none; padding: 0; color: var(--ink); font-weight: 700; font-size: 12px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-family: var(--sans); }
    .tag { display: inline-block; font-size: 10px; letter-spacing: .08em; padding: 2px 7px; border: 1px solid var(--ink); }
    .tag-o { border-color: var(--faint); color: var(--sub); }
    .tag-neg { border-color: var(--accent); color: var(--accent); }
    .input, .textarea, select.input {
      width: 100%; padding: 10px 11px; border: 1px solid var(--ink); background: var(--bg); color: var(--ink);
      font-size: 16px; font-family: var(--sans);
    }
    .textarea { resize: vertical; min-height: 60px; font-size: 14px; line-height: 1.7; }
    .field { margin-bottom: 12px; }
    .field > label { display: block; font-size: 11px; letter-spacing: .1em; color: var(--sub); margin-bottom: 5px; }
    .meter { height: 2px; background: var(--line); position: relative; }
    .meter > span { position: absolute; left: 0; top: 0; height: 100%; background: var(--ink); }
    .meter.neg > span { background: var(--accent); }
    .task { border-top: 1px solid var(--line); padding: 13px 0; }
    .task:last-child { border-bottom: 1px solid var(--line); }
    .task.stale .t-title { text-decoration: underline wavy var(--accent); text-underline-offset: 4px; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink); display: inline-block; }
    .nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: var(--max-w);
      background: var(--bg); border-top: 1px solid var(--ink); display: flex; z-index: 50; padding-bottom: env(safe-area-inset-bottom); }
    .nav-item { flex: 1; padding: 11px 2px 12px; background: none; border: none; cursor: pointer; font-family: var(--sans);
      font-size: 10px; letter-spacing: .12em; color: var(--faint); }
    .nav-item.active { color: var(--ink); }
    .nav-item.active span { border-bottom: 1px solid var(--ink); padding-bottom: 3px; }
    .tl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--line); }
    .tl-inner { position: relative; }
    .tl-band { position: absolute; height: 15px; border: 1px solid var(--ink); font-size: 9px; line-height: 13px; white-space: nowrap; overflow: hidden; padding: 0 4px; background: var(--bg); }
    .tl-band.ms { width: 15px !important; background: var(--ink); }
    .tl-today { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1px solid var(--accent); }
    .tl-yr { position: absolute; font-size: 9px; color: var(--sub); border-left: 1px solid var(--line); padding-left: 3px; }
    .tick { width: 18px; height: 18px; border: 1px solid var(--ink); flex-shrink: 0; cursor: pointer; font-size: 11px; display: flex; align-items: center; justify-content: center; }
    .tick.on { background: var(--ink); color: #fff; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .seg { display: flex; border: 1px solid var(--ink); }
    .seg > button { flex: 1; padding: 9px 4px; background: none; border: none; border-right: 1px solid var(--ink); font-size: 12px; font-weight: 700; font-family: var(--sans); cursor: pointer; }
    .seg > button:last-child { border-right: none; }
    .seg > button.on { background: var(--ink); color: #fff; }
    .mt6{margin-top:6px}.mt10{margin-top:10px}.mt16{margin-top:16px}.mb6{margin-bottom:6px}.mb10{margin-bottom:10px}
  </style>
</head>
<body>
<div id="root"></div>
<script src="./vendor/react.production.min.js"></script>
<script src="./vendor/react-dom.production.min.js"></script>
<script src="./app.js"></script>
</body>
</html>
