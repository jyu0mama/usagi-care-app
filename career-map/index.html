<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <title>なづなのキャリアMAP</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="キャリアMAP">
  <meta name="theme-color" content="#111111">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23111'/%3E%3Cpath d='M12 40 L26 26 L36 34 L52 18' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23111'/%3E%3Cpath d='M12 40 L26 26 L36 34 L52 18' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #FFFFFF;
      --ink: #111111;
      --sub: #7A7A7A;
      --faint: #B4B4B4;
      --line: #E6E6E6;
      --up: #1E8E5A;
      --down: #C8102E;
      --study: #111111;
      --job: #9A9A9A;
      --serif: 'Hiragino Mincho ProN','Yu Mincho','YuMincho','Times New Roman',serif;
      --sans: -apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Meiryo',sans-serif;
      --mono: 'SFMono-Regular',Menlo,Consolas,'Courier New',monospace;
      --max-w: 620px;
    }
    html, body { background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-text-size-adjust: 100%; }
    #root { max-width: var(--max-w); margin: 0 auto; min-height: 100vh; border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
    .screen { padding: 20px 18px calc(88px + env(safe-area-inset-bottom)); }
    .kicker { font-size: 10px; letter-spacing: .2em; color: var(--sub); text-transform: uppercase; }
    .muted { color: var(--faint); }
    .nowrap { white-space: nowrap; }
    .display { font-family: var(--serif); font-weight: 400; letter-spacing: .01em; line-height: 1.25; }
    .d-xl { font-size: 32px; }
    .d-lg { font-size: 21px; }
    .d-md { font-size: 17px; }
    .hero { margin-top: 10px; }
    .num { font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
    .sub { font-size: 12.5px; color: var(--sub); line-height: 1.8; }
    .xs { font-size: 11px; color: var(--sub); line-height: 1.65; }
    .sec { border-top: 1px solid var(--ink); padding-top: 10px; margin-top: 24px; }
    .sec-line { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 18px; }
    .row { display: flex; align-items: center; gap: 10px; }
    .between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .wrap { flex-wrap: wrap; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .rowline { padding: 7px 0; border-top: 1px solid var(--line); }
    .btn { display: inline-block; padding: 9px 14px; border: 1px solid var(--ink); background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 13px; font-weight: 700; cursor: pointer; }
    .btn:active { opacity: .7; }
    .btn:disabled { opacity: .32; cursor: default; }
    .btn-fill { background: var(--ink); color: #fff; }
    .btn-block { display: block; width: 100%; text-align: center; }
    .btn-sm { padding: 6px 10px; font-size: 12px; }
    .btn-bare { border: none; background: none; padding: 0; color: var(--sub); font-weight: 700; font-size: 12px; cursor: pointer; font-family: var(--sans); }
    .input, .textarea, select.input {
      width: 100%; padding: 9px 10px; border: 1px solid var(--ink); background: var(--bg); color: var(--ink);
      font-size: 16px; font-family: var(--sans);
    }
    .textarea { resize: vertical; min-height: 54px; font-size: 14px; line-height: 1.6; }
    .field { margin-bottom: 10px; }
    .field > label { display: block; font-size: 10px; letter-spacing: .08em; color: var(--sub); margin-bottom: 4px; }
    .meter { height: 3px; background: var(--line); position: relative; }
    .meter > span { position: absolute; left: 0; top: 0; height: 100%; background: var(--ink); }
    .meter.neg > span { background: var(--down); }
    .task { border-top: 1px solid var(--line); padding: 12px 0; }
    .task:last-child { border-bottom: 1px solid var(--line); }
    .t-title { font-size: 14px; font-weight: 700; line-height: 1.5; flex: 1; }
    .task.stale .t-title { text-decoration: underline wavy var(--down); text-underline-offset: 4px; }
    .quit { border-top: 1px solid var(--ink); margin-top: 10px; padding-top: 10px; }
    .chk { padding: 7px 0; border-top: 1px solid var(--line); }
    .chk-t { flex: 1; font-size: 13.5px; line-height: 1.45; }
    .tick { width: 19px; height: 19px; border: 1px solid var(--ink); flex-shrink: 0; cursor: pointer; font-size: 11px; display: flex; align-items: center; justify-content: center; }
    .tick.on { background: var(--ink); color: #fff; }
    .seg { display: flex; border: 1px solid var(--ink); }
    .seg > button { flex: 1; padding: 8px 4px; background: none; border: none; border-right: 1px solid var(--ink); font-size: 12px; font-weight: 700; font-family: var(--sans); cursor: pointer; color: var(--ink); }
    .seg > button:last-child { border-right: none; }
    .seg > button.on { background: var(--ink); color: #fff; }
    /* nav */
    .nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: var(--max-w);
      background: var(--bg); border-top: 1px solid var(--ink); display: flex; z-index: 50; padding-bottom: env(safe-area-inset-bottom); }
    .nav-item { flex: 1; padding: 10px 2px 11px; background: none; border: none; cursor: pointer; font-family: var(--sans);
      font-size: 10px; letter-spacing: .1em; color: var(--faint); }
    .nav-item.active { color: var(--ink); }
    .nav-item.active span { border-bottom: 1px solid var(--ink); padding-bottom: 3px; }
    /* timeline (schematic) */
    .tl2 { display: flex; border: 1px solid var(--line); }
    .tl2-labels { position: relative; width: 34px; flex-shrink: 0; border-right: 1px solid var(--line); }
    .tl2-labels > div { position: absolute; left: 4px; font-size: 9px; color: var(--sub); letter-spacing: .05em; }
    .tl2-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; flex: 1; }
    .tl2-inner { position: relative; }
    .tl2-grid { position: absolute; top: 0; border-left: 1px solid var(--line); }
    .tl2-grid > span { position: absolute; top: 2px; left: 3px; font-size: 8px; color: var(--faint); }
    .tl2-band { position: absolute; cursor: pointer; }
    .tl2-study { background: var(--study); }
    .tl2-job { background: var(--job); }
    .tl2-school { background: transparent; border: 1px solid var(--line); }
    .tl2-band.here { outline: 2px solid var(--down); outline-offset: 1px; }
    .tl2-band.sel { opacity: .55; }
    .tl2-ms { position: absolute; width: 10px; height: 10px; background: var(--ink); transform: rotate(45deg); cursor: pointer; }
    .tl2-ms.on { background: var(--down); }
    .tl2-today { position: absolute; top: 0; width: 0; border-left: 1px solid var(--down); }
    .tl2-today::before { content: ''; position: absolute; top: 0; left: -3px; border-left: 3px solid transparent; border-right: 3px solid transparent; border-top: 4px solid var(--down); }
    .tl2-cap { font-size: 10px; color: var(--sub); margin-top: 6px; line-height: 1.6; }
    .tl2-legend i { display: inline-block; width: 12px; height: 8px; vertical-align: middle; margin-right: 3px; }
    .tl2-legend i.k-study { background: var(--study); }
    .tl2-legend i.k-job { background: var(--job); }
    .tl2-legend i.k-ms { width: auto; height: auto; color: var(--ink); }
    .tl2-legend i.k-now { width: 0; border-left: 2px solid var(--down); height: 10px; }
    /* stock chart */
    .stk-head { display: flex; justify-content: space-between; align-items: flex-start; }
    .stk-price { font-size: 34px; font-family: var(--serif); letter-spacing: .01em; }
    .stk-delta { font-size: 13px; margin-top: 2px; }
    .stk-meta { text-align: right; font-size: 11px; line-height: 1.7; color: var(--sub); }
    .stk-chart { position: relative; margin-top: 12px; }
    .stk-yaxis { position: absolute; top: 0; right: 0; height: 100%; display: flex; flex-direction: column; justify-content: space-between; font-size: 8px; color: var(--faint); pointer-events: none; padding-bottom: 16px; }
    .stk-yaxis > div { background: var(--bg); padding-left: 3px; }
    .stk-range { margin-top: 10px; }
    /* phases */
    .phase { border-top: 1px solid var(--line); padding: 10px 0; }
    .phase-h { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .phase-t { font-size: 13.5px; font-weight: 700; }
    .now-tag { font-size: 9px; border: 1px solid var(--down); color: var(--down); padding: 1px 5px; margin-left: 6px; letter-spacing: .05em; }
    .pdot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); flex-shrink: 0; }
    .pdot.here { background: var(--down); }
    .pdot.past { background: var(--ink); }
  </style>
</head>
<body>
<div id="root"></div>
<script src="./vendor/react.production.min.js"></script>
<script src="./vendor/react-dom.production.min.js"></script>
<script src="./app.js"></script>
</body>
</html>
